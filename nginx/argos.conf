server {
    listen 80;
    server_name argos.local; # Puede ser la IP 192.168.1.X o dominio local

    # Directorio raiz donde se sirven los archivos estaticos del Frontend (React Vite Build)
    location / {
        root /var/www/argos/frontend/dist;
        try_files $uri $uri/ /index.html; # Fundamental para React Router
    }

    # Proxy inverso hacia el backend (Gunicorn/Django)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para el panel de Administracion Django
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Archivos estaticos generados por Django (Jazzmin admin, etc)
    location /static/ {
        alias /var/www/argos/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Archivos multimedia subidos (evidencias de tickets, vouchers, etc)
    location /media/ {
        alias /var/www/argos/backend/media/;
        expires 30d;
        access_log off;
    }
}
