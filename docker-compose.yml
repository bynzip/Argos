services:
  postgres:
    image: postgres:16
    container_name: argos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./datos/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    container_name: argos_backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
    volumes:
      - ./datos/media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    container_name: argos_nginx
    restart: unless-stopped
    build:
      context: .
      dockerfile: app/nginx/Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./datos/media:/var/www/argos/media:ro
      - staticfiles:/var/www/argos/staticfiles:ro
    depends_on:
      - backend

volumes:
  staticfiles:
